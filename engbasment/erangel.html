<!DOCTYPE html>

    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: black;
        }
        .map-container {
        position: relative;
        display: inline-block;
        padding-bottom: 0; /* Remove the padding-bottom */
        overflow: hidden; /* Prevent scrollbars from appearing */
        }   
        img {
            max-width: 100%;
            height: auto;
        }
        .hover-circle {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid rgba(255, 0, 0, 0.7);
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            background: transparent; /* Ensure transparent background */
            animation: pulse 2s infinite;
            transition: all 0.3s ease-in-out;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.4);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 0, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
            }
        }
        
        .hover-circle.focused {
            border-color: rgb(255, 0, 0);
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
            background: transparent; /* Ensure transparent background when focused */
        }
        
        area {
            cursor: pointer;
        }
        
        /* Remove any background from hover states */
        area:hover {
            background: transparent;
        }

        .info-card {
            position: fixed; /* Change from absolute to fixed */
            width: 300px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            color: white;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease-out;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .info-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .info-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        /* Apply the location-number styling to the info card's h3 */
        .info-card h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.9);
            padding: 4px 12px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .info-card p {
            margin: 12px 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-size: 15px;
            color: #e6e6e6;
            line-height: 1.6;
            letter-spacing: 0.3px;
            text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.2);
            padding: 8px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            border-left: 3px solid rgba(255, 255, 255, 0.2);
        }

        .redacted-text {
            position: relative;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .redacted-text span {
            background: #000;
            position: relative;
            padding: 0 4px;
            margin: 0 2px;
            color: transparent;
            border-radius: 2px;
            user-select: none;
        }

        /* Add a slight texture effect to make it look more like paper */
        .info-card p.redacted-style {
            background: rgba(247, 247, 247, 0.05);
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Courier New', monospace;
        }
    </style>
</head>

    <script>
       
       document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.map-container');
            const hoverCircle = document.querySelector('.hover-circle');
            const infoCard = document.querySelector('.info-card');
            const areas = Array.from(document.querySelectorAll('area'));
            let currentFocusIndex = -1;

            function showLocation(area, isFocused = false) {
                const coords = area.coords.split(',');
                const x = parseInt(coords[0]);
                const y = parseInt(coords[1]);
                
                // Show hover circle
                hoverCircle.style.left = x + 'px';
                hoverCircle.style.top = y + 'px';
                hoverCircle.style.display = 'block';
                hoverCircle.classList.toggle('focused', isFocused);

                // Get the map container's position
                const containerRect = container.getBoundingClientRect();
    
                // Calculate the absolute position relative to the viewport
                const absoluteX = containerRect.left + x;
                const absoluteY = containerRect.top + y;

                // Show info card with styled location name
                const description = area.getAttribute('data-description');
                const imagePath = area.getAttribute('data-image');
                const locationName = area.getAttribute('data-location');

                // Update the info card HTML construction in showLocation function
                infoCard.innerHTML = `
                <img src="${imagePath}" alt="${locationName}">
                <h3>${locationName}</h3>
                <p class="${description.includes('redacted-text') ? 'redacted-style' : ''}">${description}</p>
                `;

                 // Get card dimensions
                const cardWidth = 300; // Width of the card
                const cardHeight = infoCard.offsetHeight;

                // Calculate optimal position
                let cardX = absoluteX + 40;
                let cardY = absoluteY;

                 // Adjust horizontal position if it would go off-screen
                if (cardX + cardWidth > window.innerWidth) {
                    cardX = absoluteX - cardWidth - 40;
                }

                // Adjust vertical position if it would go off-screen
                if (cardY + cardHeight > window.innerHeight) {
                    cardY = window.innerHeight - cardHeight - 20;
                }

                // Ensure card doesn't go above the viewport
                if (cardY < 0) {
                    cardY = 20;
                }

                // Apply the calculated position
                infoCard.style.left = cardX + 'px';
                infoCard.style.top = cardY + 'px';
                infoCard.classList.add('visible');
            }                         

            function hideLocation() {
                hoverCircle.style.display = 'none';
                hoverCircle.classList.remove('focused');
                infoCard.classList.remove('visible');
            }

    // Mobile touch support
    function initTouchSupport() {
        let touchStartX = 0;
        let touchStartY = 0;
        
        container.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        container.addEventListener('touchend', function(e) {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            // If it's a tap (not a scroll)
            if (Math.abs(touchEndX - touchStartX) < 10 && Math.abs(touchEndY - touchStartY) < 10) {
                const rect = container.getBoundingClientRect();
                const x = touchEndX - rect.left;
                const y = touchEndY - rect.top;
                
                // Find the closest area to the touch point
                let closest = null;
                let closestDist = Infinity;
                
                areas.forEach(area => {
                    const coords = area.coords.split(',');
                    const areaX = parseInt(coords[0]);
                    const areaY = parseInt(coords[1]);
                    const dist = Math.hypot(x - areaX, y - areaY);
                    
                    if (dist < closestDist) {
                        closestDist = dist;
                        closest = area;
                    }
                });
                
                if (closest && closestDist < 30) {
                    showLocation(closest);
                    e.preventDefault();
                }
            }
        });
    }

    // Keyboard navigation
    function initKeyboardNav() {
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowRight':
                    navigateLocations(1);
                    break;
                case 'ArrowLeft':
                    navigateLocations(-1);
                    break;
                case 'Enter':
                    if (currentFocusIndex >= 0) {
                        areas[currentFocusIndex].click();
                    }
                    break;
            }
        });
    }

    function navigateLocations(direction) {
        currentFocusIndex = (currentFocusIndex + direction + areas.length) % areas.length;
        const area = areas[currentFocusIndex];
        showLocation(area, true);
    }

    // Initialize event listeners
    areas.forEach(area => {
    area.addEventListener('mouseover', () => showLocation(area));
    area.addEventListener('mouseout', hideLocation);
    area.addEventListener('click', function(e) {
        // Removed the preventDefault() to allow natural link behavior vs mapping functionality
        const href = this.getAttribute('href');
        if (href) {
            // debug to console
            console.log('Navigating to:', href);
        }
    });
});

    // Initialize touch and keyboard support
    initTouchSupport();
    initKeyboardNav();
});
    </script>
